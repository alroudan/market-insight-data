name: Kuwait market EOD update

on:
  push:
    branches: [main]
    paths:
      - "scripts/scrape.mjs"
      - "stocks.json"
      - ".github/workflows/eod-scrape.yml"
  workflow_dispatch:
  schedule:
    - cron: "32 10 * * 0-4" # 13:32 Kuwait: delayed closing data target
    - cron: "40 10 * * 0-4" # recovery if official source has not populated
    - cron: "50 10 * * 0-4"
    - cron: "10 11 * * 0-4"

permissions:
  contents: write

concurrency:
  group: kuwait-market-eod
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip duplicate completed trading day
        id: freshness
        shell: bash
        run: |
          TODAY_KUWAIT=$(TZ=Asia/Kuwait date +%F)
          # Same rule as scrape.mjs: before 13:20 Kuwait (or on Fri/Sat) the
          # expected snapshot is the previous trading day, so an early run never
          # relabels intraday prices as yesterday's close.
          EXPECTED_DATE=$(node -e "const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kuwait',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]));const d=new Date(Date.UTC(p.year,p.month-1,p.day));if(p.hour*60+p.minute<800)d.setUTCDate(d.getUTCDate()-1);while([5,6].includes(d.getUTCDay()))d.setUTCDate(d.getUTCDate()-1);console.log(d.toISOString().slice(0,10))")
          PUBLISHED_DATE=$(node -e "try { console.log(JSON.parse(require('fs').readFileSync('website/latest.json','utf8')).tradingDate || '') } catch { console.log('') }")
          OFFICIAL_VALUE_READY=$(node -e "try { const x=JSON.parse(require('fs').readFileSync('website/latest.json','utf8')); console.log(x.marketStats?.latestValueTradedDate === x.tradingDate && Number(x.marketStats?.latestValueTradedKwd) > 0 ? 'true' : 'false') } catch { console.log('false') }")
          echo "Kuwait date: $TODAY_KUWAIT"
          echo "Expected trading date: $EXPECTED_DATE"
          echo "Published trading date: $PUBLISHED_DATE"
          echo "Official turnover ready: $OFFICIAL_VALUE_READY"
          if [ "$PUBLISHED_DATE" = "$EXPECTED_DATE" ] && [ "$OFFICIAL_VALUE_READY" = "true" ]; then
            echo "already_current=true" >> "$GITHUB_OUTPUT"
            echo "Today's EOD snapshot is already published; skipping duplicate run."
          else
            echo "already_current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.freshness.outputs.already_current != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scraper dependencies
        if: steps.freshness.outputs.already_current != 'true'
        run: npm install

      - name: Install Chromium
        if: steps.freshness.outputs.already_current != 'true'
        run: npx playwright install --with-deps chromium

      - name: Fetch delayed Kuwait market data
        if: steps.freshness.outputs.already_current != 'true'
        run: npm run scrape

      - name: Commit updated snapshot
        if: steps.freshness.outputs.already_current != 'true'
        run: |
          cp data/latest.json website/latest.json
          git config user.name "market-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json website/latest.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Kuwait EOD data"
            git pull --rebase origin main
            git push
          fi


      - name: Wait for official All-Share traded value
        if: steps.freshness.outputs.already_current != 'true'
        env:
          OFFICIAL_WAIT_MINUTES: "180"
          OFFICIAL_POLL_MINUTES: "5"
        run: node scripts/wait-official-turnover.mjs

      - name: Commit official traded value
        if: steps.freshness.outputs.already_current != 'true'
        run: |
          cp data/latest.json website/latest.json
          git add data/latest.json website/latest.json
          if git diff --cached --quiet; then
            echo "No official traded value changes to commit."
          else
            git commit -m "Add official All-Share traded value"
            git pull --rebase origin main
            git push
          fi
