name: Kuwait market EOD update

on:
  workflow_dispatch:
  schedule:
    - cron: "16 10 * * 0-4"

permissions:
  contents: write

concurrency:
  group: kuwait-market-eod
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch delayed Kuwait market data
        run: npm run scrape

      - name: Commit updated snapshot
        run: |
          git config user.name "market-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Kuwait EOD data"
            git push
          fi
