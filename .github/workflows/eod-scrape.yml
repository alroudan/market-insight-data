name: Kuwait market EOD update

on:
  push:
    branches: [main]
    paths:
      - "scripts/scrape.mjs"
      - "stocks.json"
      - ".github/workflows/eod-scrape.yml"
  workflow_dispatch:
  schedule:
    - cron: "32 10 * * 0-4" # 13:32 Kuwait: delayed closing data target
    - cron: "40 10 * * 0-4" # recovery if official source has not populated
    - cron: "50 10 * * 0-4"
    - cron: "10 11 * * 0-4"

permissions:
  contents: write

concurrency:
  group: kuwait-market-eod
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip duplicate completed trading day
        id: freshness
        shell: bash
        run: |
          TODAY_KUWAIT=$(TZ=Asia/Kuwait date +%F)
          PUBLISHED_DATE=$(node -e "try { console.log(JSON.parse(require('fs').readFileSync('website/latest.json','utf8')).tradingDate || '') } catch { console.log('') }")
          OFFICIAL_VALUE_READY=$(node -e "try { const x=JSON.parse(require('fs').readFileSync('website/latest.json','utf8')); console.log(x.marketStats?.latestValueTradedDate === x.tradingDate && Number(x.marketStats?.latestValueTradedKwd) > 0 ? 'true' : 'false') } catch { console.log('false') }")
          echo "Kuwait date: $TODAY_KUWAIT"
          echo "Published trading date: $PUBLISHED_DATE"
          echo "Official turnover ready: $OFFICIAL_VALUE_READY"
          if [ "$PUBLISHED_DATE" = "$TODAY_KUWAIT" ] && [ "$OFFICIAL_VALUE_READY" = "true" ]; then
            echo "already_current=true" >> "$GITHUB_OUTPUT"
            echo "Today's EOD snapshot is already published; skipping duplicate run."
          else
            echo "already_current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.freshness.outputs.already_current != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scraper dependencies
        if: steps.freshness.outputs.already_current != 'true'
        run: npm install

      - name: Install Chromium
        if: steps.freshness.outputs.already_current != 'true'
        run: npx playwright install --with-deps chromium

      - name: Fetch delayed Kuwait market data
        if: steps.freshness.outputs.already_current != 'true'
        run: npm run scrape

      - name: Commit updated snapshot
        if: steps.freshness.outputs.already_current != 'true'
        run: |
          cp data/latest.json website/latest.json
          git config user.name "market-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json website/latest.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Kuwait EOD data"
            git pull --rebase origin main
            git push
          fi

# Manual EOD refresh requested for 2026-10-07.
