name: Monthly investment funds update

on:
  workflow_dispatch:
  schedule:
    # 14:30 Kuwait (UTC+3), checked on likely post-fifth-business-day dates.
    - cron: "30 11 7-12 * 0-4"

permissions:
  contents: write

concurrency:
  group: kuwait-monthly-funds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update official fund performance and holdings
        run: npm run funds:update

      - name: Commit newly published official data
        run: |
          git config user.name "market-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add website/funds.json
          if git diff --cached --quiet; then
            echo "No new official monthly fund data."
          else
            git commit -m "Update official monthly fund data"
            git pull --rebase origin main
            git push
          fi
