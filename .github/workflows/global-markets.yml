name: Global markets update

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-global.mjs"
      - ".github/workflows/global-markets.yml"
  workflow_dispatch:
  schedule:
    # GitHub often starts scheduled runs late; several runs a day keep the page fresh.
    - cron: "15 1,7,13,19 * * 1-5"
    - cron: "15 7 * * 0,6"

permissions:
  contents: write

concurrency:
  group: global-markets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build global markets snapshot
        run: node scripts/build-global.mjs
      - name: Commit snapshot
        run: |
          git config user.name "market-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add website/global.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Update global markets"
          git pull --rebase origin main
          git push
