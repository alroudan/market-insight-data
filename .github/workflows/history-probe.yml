name: History source probe (temporary)
on:
  push:
    branches: [claude/history-probe]
    paths: [probe/history-probe.mjs, .github/workflows/history-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node probe/history-probe.mjs
      - run: |
          git config user.name "market-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe/result.json
          git commit -m "Probe result [skip ci]"
          git push origin HEAD:claude/history-probe
